services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${IPS_DB_NAME:?Set IPS_DB_NAME}
      MARIADB_USER: ${IPS_DB_USER:?Set IPS_DB_USER}
      MARIADB_PASSWORD: ${IPS_DB_PASSWORD:?Set IPS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${IPS_DB_ROOT_PASSWORD:?Set IPS_DB_ROOT_PASSWORD}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - ips-alpha-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build: .
    image: ips-multisite:0.2.9-alpha2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${IPS_HTTP_PORT:-8044}:8000"
    environment:
      IPS_ADMIN_URL: ${IPS_ADMIN_URL:?Set IPS_ADMIN_URL}
      IPS_ADMIN_USERNAME: ${IPS_ADMIN_USERNAME:?Set IPS_ADMIN_USERNAME}
      IPS_ADMIN_PASSWORD: ${IPS_ADMIN_PASSWORD:?Set IPS_ADMIN_PASSWORD}
      IPS_SECRET_KEY: ${IPS_SECRET_KEY:?Set IPS_SECRET_KEY}
      IPS_DB_HOST: db
      IPS_DB_PORT: 3306
      IPS_DB_NAME: ${IPS_DB_NAME}
      IPS_DB_USER: ${IPS_DB_USER}
      IPS_DB_PASSWORD: ${IPS_DB_PASSWORD}
      TZ: ${TZ:-Europe/Amsterdam}
volumes:
  ips-alpha-db:
